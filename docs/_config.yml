# Rhodesia Documentation - just-the-docs configuration
remote_theme: just-the-docs/just-the-docs@v0.8.0

title: Rhodesia Language Documentation
description: >-
  Official documentation for Rhodesia, a strongly-typed imperative language
  for data science and numerical computing.

# GitHub Pages
baseurl: "/rhodesia-lang"
url: "https://giulicrenna.github.io"

# Theme features
color_scheme: light
search_enabled: true
search:
  button: true
back_to_top: true
back_to_top:
  button: true

# Aux link in the header
aux_links:
  Rhodesia on GitHub: https://github.com/giulicrenna/rhodesia-lang

# Markdown engine
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

plugins:
  - jekyll-relative-links
  - jekyll-mermaid

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache